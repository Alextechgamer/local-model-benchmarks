<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桜の庭 – Voxel Pagoda Garden</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1020; }
  body {
    font-family: "Segoe UI", "Hiragino Sans", system-ui, -apple-system, sans-serif;
    color: #f2eef0; user-select: none;
  }
  canvas { display: block; }

  /* ---------- Title (top right) ---------- */
  #title {
    position: fixed; top: 14px; right: 18px; text-align: right; z-index: 20;
    pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.75);
  }
  #title h1 {
    margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .5px;
    color: #ffd9ec;
  }
  #title p { margin: 2px 0 0; font-size: 11px; opacity: .8; letter-spacing: 2px; }

  /* ---------- Glass control panel (top left) ---------- */
  #panel {
    position: fixed; top: 14px; left: 14px; width: 296px; z-index: 20;
    background: rgba(22, 26, 44, 0.55);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,.45);
    font-size: 12px; overflow: hidden;
  }
  #panelHeader {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; cursor: pointer;
    background: rgba(255,255,255,.07);
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  #panelHeader span { font-weight: 600; letter-spacing: .6px; }
  #panelHeader button, .btn, .tgl {
    font: inherit; color: #f2eef0; cursor: pointer;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.20);
    border-radius: 8px; padding: 4px 8px;
  }
  #panelHeader button:hover, .btn:hover, .tgl:hover { background: rgba(255,255,255,.22); }
  .btn.active { background: rgba(255,120,175,.55); border-color: rgba(255,180,210,.7); }
  #panelBody { padding: 10px 12px 12px; max-height: 78vh; overflow-y: auto; }
  #panel.collapsed #panelBody { display: none; }
  .group { margin-bottom: 10px; }
  .group > label.lbl {
    display: flex; justify-content: space-between; align-items: baseline;
    text-transform: uppercase; letter-spacing: 1px; font-size: 10px;
    opacity: .75; margin-bottom: 4px;
  }
  .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .row .name { flex: 1; }
  .row .val { opacity: .7; font-variant-numeric: tabular-nums; font-size: 11px; min-width: 34px; text-align: right; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
    border-radius: 3px; background: rgba(255,255,255,.25); outline: none; margin: 4px 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #ffb3d4; border: 1px solid rgba(255,255,255,.7); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #ffb3d4;
    border: 1px solid rgba(255,255,255,.7); cursor: pointer;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .grid .btn { text-align: center; padding: 5px 2px; }
  .readouts {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px;
    font-variant-numeric: tabular-nums; opacity: .9;
    border-top: 1px solid rgba(255,255,255,.12); padding-top: 8px; font-size: 11px;
  }
  .readouts b { color: #ffd9ec; font-weight: 600; }
  #helpBtn { margin-left: 6px; padding: 2px 7px; }
  #helpBox {
    display: none; margin-top: 8px; padding: 8px 10px; line-height: 1.55;
    background: rgba(0,0,0,.28); border-radius: 8px; font-size: 11px;
    border: 1px solid rgba(255,255,255,.12);
  }
  #helpBox.open { display: block; }
  #helpBox kbd {
    background: rgba(255,255,255,.18); border-radius: 4px; padding: 0 4px;
    font-family: inherit; font-size: 10px;
  }

  /* ---------- Loading overlay ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 40%, #1d2340 0%, #070a14 75%);
    transition: opacity .9s ease; color: #ffd9ec;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .kanji { font-size: 54px; letter-spacing: 6px; }
  #loading .bar { width: 190px; height: 3px; background: rgba(255,255,255,.2); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: #ffb3d4; animation: sweep 1.1s infinite ease-in-out; }
  @keyframes sweep { 0% { transform: translateX(-100%);} 100% { transform: translateX(250%);} }
  #loading small { opacity: .7; letter-spacing: 2px; }
</style>
</head>

      <kbd>Space</kbd> auto-rotate · <kbd>N</kbd> day/night<br>
      <kbd>1</kbd>–<kbd>5</kbd> camera presets · <kbd>drag</kbd> orbit ·
      <kbd>wheel</kbd> zoom · <kbd>R</kbd> regenerate seed
    </div>

</div>

<div id="loading">
  <div class="kanji">桜</div>
  <div class="bar"><i></i></div>
  <small>BUILDING VOXEL GARDEN…</small>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =============================================================================
   1. CONFIG / CONSTANTS
   ============================================================================= */
const CFG = {
  seed: 10203,                 // seeded RNG -> identical garden every load
  gardenRadius: 38,            // garden extent (units)
  waterLevel: 5,               // pond surface height
  voxelTarget: 16500,          // target voxel budget
  voxelMin: 15000,
  voxelMax: 18000,
  petalCount: 1200,
  fireflyCount: 150,
  colors: {
    grass:      [0x7cb342, 0x8bc34a, 0x689f38, 0x9ccc65],
    dirt:       [0x6d4c41, 0x5d4037, 0x795548],
    gravel:     [0x9e9e9e, 0x8d8d8d, 0xb0b0b0],
    sand:       [0xe7d7a8, 0xdcc894, 0xefe1b5],
    stone:      [0x8e9299, 0x7f848b, 0x9ca1a8],
    stoneDark:  [0x61656c, 0x565a61],
    pillar:     [0x8e2f2b, 0x9c352f, 0x7d2622],   // dark-red lacquered pillar
    wall:       [0xf3ece0, 0xe7dccb, 0xffffff],
    roof:       [0x5a3b3f, 0x6a4448, 0x4c3236],   // dark tile roofs
    roofDark:   [0x3d2726, 0x472b2b],
    gold:       [0xffc54d, 0xffd670, 0xf0b429],
    torii:      [0xd33a2c, 0xb32d22],              // vermilion
    kasagi:     [0x1c1c1c, 0x242424],              // black top beam
    wood:       [0x8d6e43, 0x7a5c38, 0x9e7c50],
    blossom:    [0xffc0d9, 0xffd7e8, 0xffb3d1, 0xfff0f6, 0xf7c6dd],
    leaf:       [0x4e8c3f, 0x5d9b47, 0x43793a],
    bamboo:     [0x7fa650, 0x8fb85a, 0x6d9445],
    moss:       [0x6f8f4a, 0x7c9c52],
    lily:       [0x4f9d54, 0x5cae60, 0x468a49],
    koi:        [0xff7a2f, 0xff9a52, 0xffffff, 0xfff3e0],
    water:      [0x3f7f9a, 0x3a7592, 0x4a8fa8],
    hedge:      [0x3f7a3a, 0x4a8c42, 0x356b30],
    pebble:     [0xbcb7b0, 0xa9a49d, 0xcfcac3],
    glow:       0xffd9a0
  },
  layout: {
    pagoda:  { x: -8, z: -13 },
    torii:   { x: 0, z: 31 },
    pond:    { x: 16, z: 6, r: 9.5 },
    zen:     { x: -26, z: 20, w: 12, h: 11 },
    bridge:  { x: 21, z: 4 }
  }
};

/* =============================================================================
   2. SEEDED PSEUDO-RANDOM GENERATOR (mulberry32)
   ============================================================================= */
let _seed = CFG.seed >>> 0;
const RNG = {
  next() {
    _seed = (_seed + 0x6D2B79F5) >>> 0;
    let t = _seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  range(a, b) { return a + this.next() * (b - a); },
  int(a, b) { return Math.floor(this.range(a, b + 1)); },
  pick(arr) { return arr[Math.floor(this.next() * arr.length) % arr.length]; },
  reseed(s) { _seed = (s >>> 0) || 1; }
};
/** deterministic positional hash (stable across regenerations) */
function hash3(x, y, z) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (z | 0) * 2147483647;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* =============================================================================
   3. VOXEL ENGINE — position-keyed map + InstancedMesh rendering
   ============================================================================= */
const DISPOSABLES = [];        // geometry/materials to dispose when regenerating

function jitterHex(hex, amount, x, y, z) {
  // +/-4% lightness jitter driven by a positional hash => stable and seamless
  const h = hash3(x, y, z) - 0.5;
  const f = 1 + amount * 2 * h;
  let r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  r = Math.min(255, Math.max(0, Math.round(r * f)));
  g = Math.min(255, Math.max(0, Math.round(g * f)));
  b = Math.min(255, Math.max(0, Math.round(b * f)));
  return (r << 16) | (g << 8) | b;
}

class VoxelWorld {
  constructor() {
    this.map = new Map();       // "x,y,z" -> {x,y,z,c,kind}
    this.waterList = [];        // pond voxels (rendered with their own mesh)
    this.heightMap = new Map(); // "x,z" -> top solid terrain y
    this.meshes = [];
    this.waterList = [];
  }
  static key(x, y, z) { return x + ',' + y + ',' + z; }

  /** place (or de-duplicate) a single voxel. kind: 'opaque' | 'glow' | 'water' */
  add(x, y, z, color, kind = 'opaque') {
    x = Math.round(x); y = Math.round(y); z = Math.round(z);
    const k = VoxelWorld.key(x, y, z);
    const prev = this.map.get(k);
    if (prev) {
      if (prev.kind === 'opaque' && kind === 'glow') this.map.set(k, { x, y, z, c: color, kind });
      return;
    }
    if (kind === 'water') {   // water lives in its own list / own mesh
      this.waterList.push({ x, y, z, c: color });
      return;
    }
    this.map.set(k, { x, y, z, c: color, kind });
  }
  /** surface voxel (recorded so decor can be scattered on top) */
  addSurface(x, y, z, color) {
    this.add(x, y, z, color);
    this.heightMap.set(x + ',' + z, y);
  }

  // ---------------- voxel shape helpers ----------------
  box(x, y, z, w, h, d, color, kind = 'opaque') {
    for (let i = 0; i < w; i++)
      for (let j = 0; j < h; j++)
        for (let k = 0; k < d; k++)
          this.add(x + i, y + j, z + k, color, kind);
  }
  frame(x, y, z, w, h, d, color) {   // hollow rectangular shell
    for (let i = 0; i < w; i++)
      for (let j = 0; j < h; j++)
        for (let k = 0; k < d; k++)
          if (i === 0 || i === w - 1 || j === 0 || j === h - 1 || k === 0 || k === d - 1)
            this.add(x + i, y + j, z + k, color);
  }
  cube(x, y, z, s, color, kind = 'opaque') { this.box(x, y, z, s, s, s, color, kind); }
  cylinder(cx, cz, y, h, r, color, kind = 'opaque', wobble = 0) {
    for (let j = 0; j < h; j++)
      for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++)
        for (let dz = -Math.ceil(r); dz <= Math.ceil(r); dz++) {
          const rr = r + (wobble ? (hash3(cx + dx, y + j, cz + dz) - 0.5) * wobble : 0);
          if (dx * dx + dz * dz <= rr * rr) this.add(cx + dx, y + j, cz + dz, color, kind);
        }
  }
  sphere(cx, cy, cz, r, colorFn, kind = 'opaque') {
    const ri = Math.ceil(r);
    for (let dx = -ri; dx <= ri; dx++)
      for (let dy = -ri; dy <= ri; dy++)
        for (let dz = -ri; dz <= ri; dz++) {
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 <= r * r) {
            const c = (typeof colorFn === 'function')
              ? colorFn(cx + dx, cy + dy, cz + dz, d2 / (r * r))
              : colorFn;
            this.add(cx + dx, cy + dy, cz + dz, c, kind);
          }
        }
  }
  /** irregular ellipsoid blob used for mossy rocks */
  blob(cx, cy, cz, rx, ry, rz, color, noise = 0.3) {
    for (let dx = -Math.ceil(rx); dx <= Math.ceil(rx); dx++)
      for (let dy = -Math.ceil(ry); dy <= Math.ceil(ry); dy++)
        for (let dz = -Math.ceil(rz); dz <= Math.ceil(rz); dz++) {
          const nx = (hash3(cx + dx * 3, cy + dy * 3, cz + dz * 3) - 0.5) * noise;
          const ny = (hash3(cz + dz * 5, cy + dy * 5, cx + dx * 7) - 0.5) * noise;
          const nz = (hash3(cx + dx * 2, cz + dz * 2, cy + dy * 2) - 0.5) * noise;
          const d = (dx + nx * 2) ** 2 / (rx * rx) + (dy + ny * 2) ** 2 / (ry * ry) + (dz + nz * 2) ** 2 / (rz * rz);
          if (d <= 1) this.add(cx + dx, cy + dy, cz + dz, color);
        }
  }
  /** one pagoda roof tier: stepped slabs stepping inward + flared corners */
  roofTier(cx, cy, cz, r, color) {
    const C = CFG.colors;
    for (let s = r; s >= 1; s--) {
      const y = cy + (r - s);
      for (let dx = -s; dx <= s; dx++)
        for (let dz = -s; dz <= s; dz++) {
          if (Math.max(Math.abs(dx), Math.abs(dz)) !== s) continue; // hollow ring
          const col = ((dx + dz) % 3 === 0) ? C.roofDark[1] : color;
          this.add(cx + dx, y, cz + dz, col);
        }
    }
    // corner eaves flare down/out from the four corners
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const bx = cx + sx * r, bz = cz + sz * r;
      this.add(bx, cy - 1, bz, C.roofDark[0]);
      this.add(bx + sx, cy - 1, bz, C.roofDark[0]);
      this.add(bx, cy - 1, bz + sz, C.roofDark[0]);
      this.add(bx + sx, cy, bz + sz, color);
    }
  }

  // ---------------- rendering ----------------
  buildMeshes(scene) {
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const groups = { opaque: [], glow: [] };
    let total = 0;
    for (const v of this.map.values()) {
      (groups[v.kind] || groups.opaque).push(v);
      total++;
    }
    const dummy = new THREE.Object3D();
    const col = new THREE.Color();
    for (const kind of ['opaque', 'glow']) {
      const list = groups[kind];
      if (!list.length) continue;
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.86, metalness: 0.02 });
      if (kind === 'glow') mat.emissive = new THREE.Color(CFG.colors.glow);
      const mesh = new THREE.InstancedMesh(boxGeo, mat, list.length);
      mesh.castShadow = kind === 'opaque';
      mesh.receiveShadow = true;
      mesh.name = 'voxels_' + kind;
      for (let i = 0; i < list.length; i++) {
        const v = list[i];
        dummy.position.set(v.x, v.y, v.z);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        mesh.setColorAt(i, col.setHex(jitterHex(v.c, 0.04, v.x, v.y, v.z), THREE.SRGBColorSpace));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.frustumCulled = true;
      scene.add(mesh);
      this.meshes.push(mesh);
      DISPOSABLES.push(mesh, mat);
    }
    DISPOSABLES.push(boxGeo);
    this.count = total;
  }
  dispose(scene) {
    for (const m of this.meshes) {
      scene.remove(m);
      m.material.dispose();
      m.dispose();
    }
    this.meshes.length = 0;
    this.map.clear();
    this.heightMap.clear();
  }
}
/* =============================================================================
   4. TERRAIN LOOKUPS (pond basin, stone path, zen sand, hill)
   ============================================================================= */
const T = {
  pathPoints: [
    { x: 0, z: 31 }, { x: 3, z: 21 }, { x: -2, z: 8 }, { x: -8, z: -13 }
  ]
};

/** gently rolling base height of the garden ground */
function terrainBaseHeight(x, z) {
  let h = 4 * Math.sin(x * 0.075) * Math.cos(z * 0.085)
        + 2.5 * Math.sin(x * 0.5 + z * 0.37)
        + 1.5 * Math.cos(z * 0.11 + x * 0.03);
  const d = Math.hypot(x - CFG.layout.pagoda.x, z - CFG.layout.pagoda.z);
  h += 11 * Math.pow(Math.max(0, 1 - d / 17), 1.7);   // hill under the pagoda
  return h;
}

/** irregular pond outline (radial wobble). returns {inside, d, r} */
function pondAt(x, z) {
  const P = CFG.layout.pond;
  const dx = x - P.x, dz = z - P.z;
  const d = Math.hypot(dx, dz);
  const a = Math.atan2(dz, dx);
  const r = P.r * (1 + 0.22 * Math.sin(a * 3 + 0.7) + 0.16 * Math.cos(a * 5 + 2.1));
  return { inside: d <= r, d, r };
}

/** distance to the stone path and the path's ground height there */
function pathInfo(x, z) {
  const P = T.pathPoints;
  let best = { d: 1e9, y: 0 };
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const t = Math.min(1, Math.max(0, ((x - a.x) * dx + (z - a.z) * dz) / (dx * dx + dz * dz)));
    const d = Math.hypot(x - (a.x + dx * t), z - (a.z + dz * t));
    if (d < best.d) {
      const ya = terrainBaseHeight(a.x, a.z), yb = terrainBaseHeight(b.x, b.z);
      best = { d, y: ya + (yb - ya) * t };
    }
  }
  return best;
}

/* =============================================================================
   5. SCENE ASSEMBLY — terrain, pond, path, pagoda
   ============================================================================= */
let world = null;                       // active VoxelWorld
const LANTERN_LIGHTS = [];              // point lights that warm up at night
const PAGODA_LIGHTS = [];

/** fill a column from y0 up to y1 (inclusive) with a color */
function fillColumn(x, z, y0, y1, color) {
  const a = Math.min(y0, y1), b = Math.max(y0, y1);
  for (let y = a; y <= b; y++) world.add(x, y, z, color);
}

function buildTerrain() {
  const C = CFG.colors, R = CFG.gardenRadius, WL = CFG.waterLevel;
  const floorY = WL - 3;

  for (let x = -R; x <= R; x++) {
    for (let z = -R; z <= R; z++) {
      if (Math.hypot(x, z) > R) continue;

      const pond = pondAt(x, z);
      if (pond.inside) {                     // --- pond basin ---
        fillColumn(x, z, floorY - 2, floorY, C.dirt[1]);
        world.add(x, floorY, z, C.gravel[0]);
        world.addSurface(x, floorY, z, C.gravel[0]);
        world.heightMap.set(x + ',' + z, floorY);
        continue;
      }

      // --- grass ground with dirt/gravel patches ---
      let h = Math.round(terrainBaseHeight(x, z));
      const p = pathInfo(x, z);
      const onPath = p.d < 1.8;
      if (onPath) h = Math.round(p.y);

      const Z = CFG.layout.zen;
      const inZen = x >= Z.x && x <= Z.x + Z.w && z >= Z.z && z <= Z.z + Z.h;
      if (inZen) h = Math.round(terrainBaseHeight(Z.x + Z.w / 2, Z.z + Z.h / 2));

      const n = hash3(x, 7, z);
      let top;
      if (inZen)      top = C.sand[((n * 3) | 0) % 3];
      else if (onPath) top = (n > 0.45 ? C.gravel[((n * 3) | 0) % 3] : C.stone[((n * 3) | 0) % 3]);
      else if (n < 0.06) top = C.dirt[1];                       // bare dirt patch
      else if (n < 0.12) top = C.gravel[1];                     // gravel patch
      else if (n < 0.60) top = C.grass[0];
      else top = C.grass[1 + (((n * 3) | 0) % 3)];

      world.addSurface(x, h, z, top);
      if (!onPath && !inZen) {                 // one dirt layer below the grass
        world.add(x, h - 1, z, C.dirt[1]);
        if (hash3(x, 99, z) < 0.25) world.add(x, h - 2, z, C.dirt[2]);
      }
    }
  }

  // --- stone edging ringing the pond shoreline ---
  const P = CFG.layout.pond, WL2 = CFG.waterLevel;
  for (let x = P.x - 14; x <= P.x + 14; x++) {
    for (let z = P.z - 14; z <= P.z + 14; z++) {
      if (Math.hypot(x, z) > CFG.gardenRadius) continue;
      const pond = pondAt(x, z);
      if (pond.inside || pond.d > pond.r + 1.4) continue;
      const col = C.stone[((hash3(x, 3, z) * 3) | 0) % 3];
      fillColumn(x, z, WL2 - 1, WL2 - 1, col);
      const h = world.heightMap.get(x + ',' + z);
      const ground = (h === undefined ? Math.round(terrainBaseHeight(x, z)) : h);
      if (ground < WL2 - 2) fillColumn(x, z, ground, WL2 - 2, C.stone[1]); // skirt down
      world.heightMap.set(x + ',' + z, WL2 - 1);
    }
  }

  // --- raked concentric sand rings in the zen area ---
  const Z = CFG.layout.zen;
  const zx = Z.x + Z.w / 2, zz = Z.z + Z.h / 2;
  for (let r = 1; r <= Z.w * 0.8; r += 1) {
    const col = C.sand[((r % 2) === 0) ? 1 : 2];
    for (let a = 0; a < 64; a++) {
      const th = a / 64 * Math.PI * 2;
      const px = Math.round(zx + Math.cos(th) * r * 1.7);
      const pz = Math.round(zz + Math.sin(th) * r);
      if (px < Z.x || px > Z.x + Z.w || pz < Z.z || pz > Z.z + Z.h) continue;
      const h = world.heightMap.get(px + ',' + pz);
      if (h !== undefined) world.add(px, h, pz, col);
    }
  }

  // --- stepping stones leading into the zen garden ---
  for (let i = 0; i < 4; i++) {
    const sx = Z.x + Z.w / 2 + (i - 1.5), sz = Z.z + Z.h + 3 + (i % 2);
    const h = world.heightMap.get(Math.round(sx) + ',' + Math.round(sz));
    if (h !== undefined) world.add(Math.round(sx), h, Math.round(sz), C.stone[2]);
  }
}

/* ---------------------- five-tier pagoda (centerpiece) ---------------------- */
function buildPagoda() {
  const C = CFG.colors;
  const L = CFG.layout.pagoda;
  const gy = world.heightMap.get(L.x + ',' + L.z);
  if (gy === undefined) return;
  const baseY = gy + 1;
  let y = baseY;

  // --- cut-stone platform (stepped octagon) ---
  for (let s = 9; s >= 6; s--) {
    world.cylinder(L.x, L.z, y, 2, s, C.stone[0], 'opaque', 0.6);
    y += 2;
  }
  y -= 2;                                     // top platform surface
  world.cylinder(L.x, L.z, y, 1, 7, C.stoneDark[0], 'opaque', 0.5);
  y += 1;

  // --- five tiers ---
  let hw = 5;
  for (let t = 0; t < 5; t++) {
    const bodyY = y;
    // four dark-red corner pillars
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      fillColumn(L.x + sx * hw, L.z + sz * hw, bodyY, bodyY + 3, C.pillar[0]);
    }
    // white plaster walls between the pillars
    for (let i = -hw + 1; i < hw; i++) {
      world.add(L.x + i, bodyY + 1, L.z - hw, C.wall[0]);
      world.add(L.x + i, bodyY + 1, L.z + hw, C.wall[0]);
      world.add(L.x - hw, bodyY + 1, L.z + i, C.wall[0]);
      world.add(L.x + hw, bodyY + 1, L.z + i, C.wall[0]);
      world.add(L.x + i, bodyY + 2, L.z - hw, C.wall[1]);
      world.add(L.x + i, bodyY + 2, L.z + hw, C.wall[1]);
      world.add(L.x - hw, bodyY + 2, L.z + i, C.wall[1]);
      world.add(L.x + hw, bodyY + 2, L.z + i, C.wall[1]);
    }
    // glowing windows in the middle of each face
    world.add(L.x, bodyY + 1, L.z - hw - 1, C.glow, 'glow');
    world.add(L.x, bodyY + 1, L.z + hw + 1, C.glow, 'glow');
    // veranda walkway slab
    for (let dx = -hw; dx <= hw; dx++)
      for (let dz = -hw; dz <= hw; dz++)
        if (Math.abs(dx) === hw || Math.abs(dz) === hw)
          world.add(L.x + dx, bodyY - 1, L.z + dz, C.wood[0]);

    // warm interior light (intensity tied to time of day)
    const pl = new THREE.PointLight(0xffc07a, 0, 16, 2);
    pl.position.set(L.x, bodyY + 2, L.z);
    pl.visible = false;
    scene.add(pl);
    PAGODA_LIGHTS.push(pl);

    y = bodyY + 4;
    world.roofTier(L.x, y, L.z, hw + 3, C.roof[0]);
    y += hw + 3;
    hw = Math.max(2, hw - 1);
  }

  // --- golden finial (sōrin) ---
  const fx = L.x, fz = L.z;
  world.cylinder(fx, fz, y, 2, 1.6, C.gold[0]);
  y += 2;
  world.sphere(fx, y + 1, fz, 2, C.gold[1]);
  y += 3;
  world.cylinder(fx, fz, y, 1, 2.4, C.gold[2], 'opaque', 0);
  y += 1;
  world.cylinder(fx, fz, y, 1, 1.6, C.gold[0]);
  y += 1;
  world.cylinder(fx, fz, y, 4, 0.9, C.gold[1]);
  y += 4;
  world.add(fx, y, fz, C.glow, 'glow');
  world.sphere(fx, y + 1, fz, 1.4, C.gold[2]);
  T.pagodaTop = { x: fx, y: y + 2, z: fz };
}
/* ---------------------- pond water, lilies, koi, bridge ---------------------- */
let waterMesh = null, waterBase = null, waterCount = 0;

function buildWater() {
  const P = CFG.layout.pond, C = CFG.colors, WL = CFG.waterLevel;
  const pts = [];
  for (let x = P.x - 14; x <= P.x + 14; x++) {
    for (let z = P.z - 14; z <= P.z + 14; z++) {
      if (!pondAt(x, z).inside) continue;
      const occupied = world.map.has(VoxelWorld.key(x, WL, z));
      pts.push({ x, z, occupied });
    }
  }
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({
    color: C.water[0], transparent: true, opacity: 0.74,
    roughness: 0.12, metalness: 0.25, flatShading: true
  });
  waterCount = pts.length;
  waterMesh = new THREE.InstancedMesh(geo, mat, pts.length);
  waterMesh.receiveShadow = true;
  waterMesh.name = 'water';
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  waterBase = new Float32Array(pts.length * 3);
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const y = WL - (p.occupied ? 0.12 : 0);        // sit under lily pads
    dummy.position.set(p.x, y, p.z);
    dummy.scale.set(1, 0.35, 1);                    // shallow slab of water
    dummy.updateMatrix();
    waterMesh.setMatrixAt(i, dummy.matrix);
    waterMesh.setColorAt(i, col.setHex(C.water[((p.x * 3 + p.z * 5) % 3 + 3) % 3], THREE.SRGBColorSpace));
    waterBase[i * 3] = p.x; waterBase[i * 3 + 1] = y; waterBase[i * 3 + 2] = p.z;
  }
  waterMesh.instanceMatrix.needsUpdate = true;
  if (waterMesh.instanceColor) waterMesh.instanceColor.needsUpdate = true;
  scene.add(waterMesh);
  DISPOSABLES.push(geo, mat, waterMesh);
}

function buildLilies() {
  const P = CFG.layout.pond, C = CFG.colors, WL = CFG.waterLevel;
  const n = RNG.int(7, 11);
  for (let i = 0; i < n; i++) {
    const a = RNG.range(0, Math.PI * 2), r = RNG.range(2, P.r - 1.5);
    const x = Math.round(P.x + Math.cos(a) * r), z = Math.round(P.z + Math.sin(a) * r);
    if (!pondAt(x, z).inside) continue;
    const rad = RNG.range(1, 2.1);
    for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
      if (dx * dx + dz * dz <= rad * rad)
        world.add(x + dx, WL, z + dz, C.lily[(i % C.lily.length)]);
    }
    if (RNG.next() < 0.6) world.add(x, WL + 1, z, 0xfff0f5);   // blossom
  }
}

/* koi fish — one InstancedMesh holding every body voxel of 3 fish */
let fishMesh = null, fishData = [];
function buildKoi() {
  const P = CFG.layout.pond, C = CFG.colors, WL = CFG.waterLevel;
  const geo = new THREE.BoxGeometry(0.42, 0.42, 0.42);
  const mat = new THREE.MeshBasicMaterial({ vertexColors: false });
  const parts = [];
  const fishCount = 3;
  for (let f = 0; f < fishCount; f++) {
    const white = f > 1;
    const c = white ? 0xffffff : C.koi[0];
    const partDefs = [
      [0, 0, 0, 1.0], [1, 0, 0, 0.8], [2, 0, 0, 0.6], [-1, 0, 0, 0.7],
      [-2, 0, 0, 0.5], [0, 1, 0, 0.4], [0, -1, 0, 0.4]
    ];
    for (const [ox, oy, oz] of partDefs) {
      parts.push({ f, ox, oy, oz, c: ((f === 0 && oy === 1) || (f === 1 && ox === 0 && oy === 0)) ? 0xffffff : c });
    }
    fishData.push({
      cx: P.x + RNG.range(-3, 3), cz: P.z + RNG.range(-3, 3),
      r: RNG.range(2.4, 5.2), speed: RNG.range(0.2, 0.4) * (RNG.next() < 0.5 ? -1 : 1),
      phase: RNG.range(0, 6.28)
    });
  }
  fishMesh = new THREE.InstancedMesh(geo, mat, parts.length);
  fishMesh.name = 'koi';
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  const partDef = parts;
  for (let i = 0; i < partDef.length; i++) {
    const p = partDef[i];
    dummy.position.set(p.f * 10, 0, 0);
    dummy.updateMatrix();
    fishMesh.setMatrixAt(i, dummy.matrix);
    fishMesh.setColorAt(i, col.setHex(p.c, THREE.SRGBColorSpace));
  }
  fishMesh.instanceMatrix.needsUpdate = true;
  if (fishMesh.instanceColor) fishMesh.instanceColor.needsUpdate = true;
  fishMesh.frustumCulled = true;
  scene.add(fishMesh);
  DISPOSABLES.push(geo, mat, fishMesh);
}

const _fishDummy = new THREE.Object3D(), _fishCol = new THREE.Color();
function updateKoi(t) {
  if (!fishMesh) return;
  const P = CFG.layout.pond, WL = CFG.waterLevel, C = CFG.colors;
  const dummy = _fishDummy, col = _fishCol;
  let idx = 0;
  for (let f = 0; f < fishData.length; f++) {
    const fd = fishData[f];
    const a = fd.phase + t * fd.speed;
    const x = fd.cx + Math.cos(a) * fd.r;
    const z = fd.cz + Math.sin(a) * fd.r;
    const y = WL - 0.6 + Math.sin(t * 2 + f) * 0.18;
    const heading = Math.atan2(Math.cos(a) * fd.speed, -Math.sin(a) * fd.speed) + Math.PI / 2;
    const scale = 0.9 + 0.2 * Math.sin(a * 1.7);
    for (let p = 0; p < 7; p++) {
      const ox = [0, 1, 2, -1, -2, 0, 0][p];
      const oy = [0, 0, 0, 0, 0, 1, -1][p];
      dummy.position.set(
        x + Math.cos(heading) * ox * 0.45,
        y + oy * 0.2,
        z - Math.sin(heading) * ox * 0.45
      );
      dummy.rotation.y = -heading;
      dummy.scale.setScalar(scale);
      dummy.updateMatrix();
      fishMesh.setMatrixAt(idx, dummy.matrix);
      fishMesh.setColorAt(idx++, col.setHex(f === 0 ? C.koi[0] : (f === 1 ? 0xffffff : C.koi[1]), THREE.SRGBColorSpace));
    }
  }
  fishMesh.instanceMatrix.needsUpdate = true;
  if (fishMesh.instanceColor) fishMesh.instanceColor.needsUpdate = true;
}

function buildBridge() {
  const P = CFG.layout.pond, C = CFG.colors, WL = CFG.waterLevel;
  const bz = P.z - 3;
  let x0 = P.x, x1 = P.x;
  while (pondAt(x0 - 1, bz).inside) x0--;
  while (pondAt(x1 + 1, bz).inside) x1++;
  x0 -= 3; x1 += 3;
  const span = x1 - x0;
  for (let x = x0; x <= x1; x++) {
    const tt = (x - x0) / span;
    const arch = Math.sin(tt * Math.PI) * 2.2;
    const y = Math.round(WL + arch);
    world.box(x, y, bz, 1, 1, 2, C.wood[0]);
    if ((x - x0) % 3 === 0) world.add(x, y, bz - 1, C.wood[2]);
    if ((x - x0) % 3 === 0) world.add(x, y, bz + 2, C.wood[2]);
    world.add(x, y + 1, bz - 1, C.wood[1]);
    world.add(x, y + 1, bz + 2, C.wood[1]);
  }
  // mooring posts on both banks
  for (const sx of [x0, x1]) {
    fillColumn(sx, WL, bz, bz + 2, C.wood[2]);
    fillColumn(sx, WL, bz + 1, bz + 2, C.wood[2]);
  }
}

/* ---------------------- cherry blossom trees ---------------------- */
function buildTree(x, z) {
  const gy = world.heightMap.get(x + ',' + z);
  if (gy === undefined) return;
  const C = CFG.colors;
  const h = RNG.int(4, 7);
  const bend = RNG.range(-0.12, 0.12);
  for (let i = 0; i < h; i++) {
    const bx = Math.round(x + bend * i * i);
    world.add(bx, gy + 1 + i, z, i % 2 ? C.wood[0] : C.wood[1]);
  }
  // branches
  const canopies = [];
  const branches = RNG.int(3, 5);
  for (let b = 0; b < branches; b++) {
    const th = RNG.range(0, Math.PI * 2);
    const len = RNG.range(2, 3.5);
    const by = gy + Math.round(h * RNG.range(0.45, 0.95));
    let bx = x, bz = z;
    for (let i = 1; i <= len; i++) {
      bx = Math.round(x + Math.cos(th) * i * 0.8);
      bz = Math.round(z + Math.sin(th) * i * 0.8);
      world.add(bx, by + Math.round(i * 0.7), bz, C.wood[2]);
    }
    canopies.push({ x: bx + Math.cos(th) * 1.2, z: bz + Math.sin(th) * 1.2, y: by + Math.round(len * 0.7) + 1, r: RNG.range(2.2, 3.2) });
  }
  canopies.push({ x, z, y: gy + h + 1, r: RNG.range(2.8, 3.8) });
  const shades = [];
  const nShades = RNG.int(3, 5);
  for (let i = 0; i < nShades; i++) shades.push(C.blossom[RNG.int(0, C.blossom.length - 1)]);
  for (const c of canopies) {
    world.sphere(c.x, c.y, c.z, c.r, (px, py, pz, t) => {
      const n = hash3(px, py, pz);
      let col = shades[(n * shades.length) | 0];
      if (n > 0.93) col = C.leaf[0];      // a few leaves mixed in
      return col;
    });
  }
}

/* ---------------------- torii gate ---------------------- */
function buildTorii() {
  const C = CFG.colors;
  const L = CFG.layout.torii;
  const gy = world.heightMap.get(L.x + ',' + L.z);
  if (gy === undefined) return;
  const y0 = gy + 1;
  const half = 3.2;
  // stone bases + vermilion pillars
  for (const sx of [-1, 1]) {
    world.cylinder(L.x + sx * half, L.z, y0, 1, 2.1, C.stoneDark[0], 'opaque', 0.4);
    fillColumn(L.x + sx * half, L.z, y0 + 1, y0 + 8, C.torii[0]);
  }
  const top = y0 + 8;
  // nuki (lower tie beam)
  for (let i = -5; i <= 5; i++) {
    world.add(L.x + i, top - 1, L.z, C.wood[0]);
    world.add(L.x + i, top - 1, L.z + 1, C.wood[0]);
  }
  // kasagi (black top beam) with a gentle upward curve
  const curve = (i) => Math.round(0.35 * (i * i / 12.5) ** 0.55 - 0.3);
  for (let i = -6; i <= 6; i++) {
    const cy = top + 1 + curve(i);
    world.add(L.x + i, cy, L.z - 1, C.kasagi[0]);
    world.add(L.x + i, cy, L.z, C.kasagi[0]);
    world.add(L.x + i, cy, L.z + 1, C.kasagi[0]);
  }
  for (let i = -5; i <= 5; i++) world.add(L.x + i, top, L.z - 1, C.kasagi[1]);
  // gakuzuka (centre strut)
  fillColumn(L.x, L.z, top - 1, top + 1, C.torii[1]);
  world.add(L.x, top + 2, L.z, C.kasagi[0]);
  // small approach stones
  for (const sx of [-1, 1]) {
    world.cylinder(L.x + sx * 6, L.z + 2, gy, 1, 1.6, C.stone[1], 'opaque', 0.4);
    world.cylinder(L.x + sx * 6, L.z + 2, gy + 1, 1, 1.0, C.stone[2], 'opaque', 0.4);
  }
}

/* ---------------------- stone lantern (tōrō) ---------------------- */
function buildLantern(x, z) {
  const C = CFG.colors;
  const gy = world.heightMap.get(x + ',' + z);
  if (gy === undefined) return;
  let y = gy + 1;
  world.cylinder(x, z, y, 1, 2.0, C.stoneDark[1], 'opaque', 0.35);
  y += 1;
  fillColumn(x, z, y, y + 1, C.stone[0]);
  const core = world.heightMap.get(x + ',' + z);
  y = core + 1;
  // light chamber: stone frame + glowing core
  world.cylinder(x, z, y, 3, 1.9, C.stone[0], 'glow', 0.1);
  world.add(x, y, z, C.glow, 'glow');
  world.cylinder(x, z, y + 1, 1, 1.4, C.stone[1], 'opaque', 0.2);
  // roof slab + finial
  world.cylinder(x, z, y + 2, 1, 2.4, C.stoneDark[0], 'opaque', 0.2);
  world.add(x, y + 3, z, C.stone[0]);
  world.add(x, y + 4, z, C.gold[0]);
  world.add(x, y + 5, z, C.glow, 'glow');
  const pl = new THREE.PointLight(0xffae5e, 0, 9, 2);
  pl.position.set(x, y + 0.5, z);
  pl.visible = false;
  scene.add(pl);
  LANTERN_LIGHTS.push(pl);
}

/* ---------------------- bamboo grove, rocks, bench, hedges ---------------------- */
function buildBamboo(cx, cz) {
  const C = CFG.colors;
  const n = RNG.int(11, 15);
  for (let i = 0; i < n; i++) {
    const x = Math.round(cx + RNG.range(-4.5, 4.5));
    const z = Math.round(cz + RNG.range(-4.5, 4.5));
    const gy = world.heightMap.get(x + ',' + z);
    if (gy === undefined) continue;
    const h = RNG.int(6, 11);
    for (let j = 0; j < h; j++) {
      const col = (j % 3 === 0) ? C.bamboo[2] : C.bamboo[j % 2];
      world.add(x, gy + 1 + j, z, col);
    }
    // leaf fronds at the top
    for (let l = 0; l < 3; l++) {
      const a = RNG.range(0, 6.28);
      world.add(x + Math.round(Math.cos(a)), gy + h, z + Math.round(Math.sin(a)), C.leaf[1]);
      world.add(x + Math.round(Math.cos(a) * 2), gy + h - 1, z + Math.round(Math.sin(a) * 2), C.leaf[2]);
    }
  }
}

function buildRock(x, z, r) {
  const C = CFG.colors;
  const gy = world.heightMap.get(x + ',' + z);
  if (gy === undefined) return;
  const rx = r * RNG.range(0.9, 1.3), ry = r * RNG.range(0.6, 0.95), rz = r * RNG.range(0.9, 1.3);
  world.blob(x, gy + Math.round(ry * 0.4), z, rx, ry, rz, C.stone[2], 0.35);
  // mossy cap
  world.blob(x, gy + Math.round(ry * 0.9), z, rx * 0.55, ry * 0.45, rz * 0.55, C.moss[0], 0.4);
}

function buildBench(x, z) {
  const C = CFG.colors;
  const gy = world.heightMap.get(x + ',' + z);
  if (gy === undefined) return;
  const y = gy + 1;
  world.box(x - 2, y + 1, z, 5, 1, 1, C.wood[0]);      // seat
  world.box(x - 2, y + 2, z, 1, 1, 1, C.wood[1]);      // backrest
  world.box(x + 2, y + 2, z, 1, 1, 1, C.wood[1]);
  world.add(x - 1, y + 2, z, C.wood[2]);
  world.add(x, y + 2, z, C.wood[2]);
  world.add(x + 1, y + 2, z, C.wood[2]);
  fillColumn(x - 2, z, y, y, C.wood[2]);
  fillColumn(x + 2, z, y, y, C.wood[2]);
  fillColumn(x - 2, z, y + 3, y + 3, C.wood[2]);
  fillColumn(x + 2, z, y + 3, y + 3, C.wood[2]);

function buildHedges(x0, z0, count, axis) {
  const C = CFG.colors;
  for (let i = 0; i < count; i++) {
    const x = axis === 'x' ? x0 + i : x0;
    const z = axis === 'z' ? z0 + i : z0;
    const gy = world.heightMap.get(x + ',' + z);
    if (gy === undefined) continue;
    const h = RNG.int(1, 2);
    for (let j = 0; j < h; j++) world.add(x, gy + 1 + j, z, C.hedge[(i + j) % C.hedge.length]);

/* ---------------------- fill the voxel budget with scatter ---------------------- */
function scatterDetails() {
  const C = CFG.colors;
  let guard = 0;
  while (world.map.size < CFG.voxelTarget && guard < 40000) {
    guard++;
    const x = Math.round(RNG.range(-CFG.gardenRadius, CFG.gardenRadius));
    const z = Math.round(RNG.range(-CFG.gardenRadius, CFG.gardenRadius));
    const key = x + ',' + z;
    const gy = world.heightMap.get(key);
    if (gy === undefined) continue;
    if (world.map.has(x + ',' + (gy + 1) + ',' + z)) continue;
    if (pondAt(x, z).inside) continue;
    if (pathInfo(x, z).d < 2.2) continue;
    const n = hash3(x, 55, z);
    if (n < 0.42) {                                  // pebbles
      const c = C.pebble[((n * 7) | 0) % C.pebble.length];
      world.add(x, gy, z, c);
      if (RNG.next() < 0.4) world.add(x + 1, gy, z, c);
    } else if (n < 0.70) {                            // grass tufts
      world.add(x, gy + 1, z, C.grass[3]);
      if (RNG.next() < 0.3) world.add(x, gy + 2, z, C.grass[3]);
    } else if (n < 0.90) {                           // fallen petals
      world.add(x, gy + 1, z, C.blossom[(n * 3) | 0 % C.blossom.length]);
    } else {                                          // tiny flowers
      world.add(x, gy + 1, z, 0xfff6f8);
      world.add(x, gy + 2, z, 0xffd9e8);
    }
  }
}

/** interpolate a colour along a stop list, written into `out` (no allocations) */

function gradientAt(stops, h, out) {
  out = out || _gradOut;
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (h >= a.h && h <= b.h) {

const skyState = { night: 0, dawn: 0, day: 0 };
function updateSky(tod) {
  const el = Math.sin((tod - 6) / 12 * Math.PI);      // 1 noon, 0 sunrise/sunset, -1 midnight
  const dayF = smoothstep(0.12, 0.65, el);
  const nightF = 1 - smoothstep(-0.22, 0.18, el);
  const duskF = Math.max(smoothstep(-0.12, 0.05, el) * (1 - smoothstep(0.25, 0.6, el)), 0);
  const dawnF = smoothstep(0.0, 0.14, el) * (1 - smoothstep(0.2, 0.55, el));
  skyState.night = nightF; skyState.dawn = dawnF; skyState.day = dayF;

  // sun position across the sky
  const ang = (tod - 6) / 12 * Math.PI;
  const r = 130;
  sun.position.set(Math.cos(ang) * r * 0.85, Math.max(2, Math.sin(ang) * r), 42 + Math.sin(ang) * 22);
  sun.target.position.set(0, 4, 0);
  sun.color.copy(_sunWarm).copy(PAL.sunrise).lerp(_sunWhite, dayF);
  sun.intensity = 1.35 * dayF + 0.25 * duskF;

  moon.intensity = 0.22 * nightF;
  moon.color.setHex(0x9db8ff);

  hemi.color.copy(sun.color).lerp(new THREE.Color(0xbcd9f2), 0.5);
  hemi.intensity = 0.14 + 0.55 * dayF + 0.18 * nightF;
  ambient.intensity = 0.07 + 0.14 * dayF + 0.09 * nightF;

  scene.background.copy(gradientAt(SKY_STOPS, tod, _skyTmp1));
  scene.fog.color.copy(gradientAt(FOG_STOPS, tod, _skyTmp2));
  scene.fog.density = 0.0045 + 0.010 * nightF + 0.008 * dawnF;

  starMat.opacity = nightF * 0.9;
  mistGroup.children.forEach(c => { c.material.opacity = dawnF * 0.22 + nightF * 0.1; });

  // warm glows after dark
  let li = Math.min(1, nightF * 1.4 + duskF * 0.35);
  for (const l of PAGODA_LIGHTS) { l.intensity = 2.4 * li; l.visible = li > 0.02; }
  for (const l of LANTERN_LIGHTS) { l.intensity = 1.5 * li; l.visible = li > 0.02; }

  return { dayF, nightF, duskF, dawnF };

  buildBench(P.x - 13, P.z + 8);
  const Z = CFG.layout.zen;
  buildHedges(Z.x - 1, Z.z + Z.h + 2, 10, 'x');
  buildHedges(Z.x + Z.w + 2, Z.z - 1, 9, 'z');
  buildHedges(-6, 22, 7, 'x');
  buildHedges(4, 18, 6, 'z');

  // ---- fill the voxel budget with scatter detail ----
  scatterDetails();

  world.buildMeshes(scene);
  buildPetals();
  buildFireflies();
  makePresets();

  console.log('[pagoda] voxel count:', world.count, '| seed:', currentSeed);
  el.roVoxels.textContent = world.count.toLocaleString();
  el.roSeed.textContent = String(seed);
  applyWireframe();
  updateSky(state.tod);
}

/* =============================================================================
   10. CAMERA PRESETS + LERP TWEEN (no external tween library)
   ============================================================================= */
const PRESETS = [];
function makePresets() {
  const P = CFG.layout.pond, L = CFG.layout.pagoda, G = CFG.layout.torii;
  const py = T.pagodaTop ? T.pagodaTop.y : 26;
  const tree = treePositions.length ? treePositions[0] : { x: 22, z: 12 };
  PRESETS.length = 0;
  PRESETS.push(
    { name: 'Overview', pos: [62, 44, 70], tgt: [0, 6, 0] },
    { name: 'Pagoda',   pos: [L.x - 20, py * 0.9 + 6, L.z + 20], tgt: [L.x, py * 0.6, L.z] },
    { name: 'Pond',     pos: [P.x + 17, CFG.waterLevel + 9, P.z + 17], tgt: [P.x, CFG.waterLevel - 1, P.z] },
    { name: 'Torii',    pos: [G.x + 1, CFG.waterLevel + 9, G.z + 17], tgt: [G.x, CFG.waterLevel + 6, G.z] },
    { name: 'Blossoms', pos: [tree.x - 11, 15, tree.z + 11], tgt: [tree.x, 10, tree.z] }
  );
}
const tween = {
  active: false, t: 0, dur: 1.7,
  fromP: new THREE.Vector3(), toP: new THREE.Vector3(),
  fromT: new THREE.Vector3(), toT: new THREE.Vector3()
};
function flyTo(i) {
  const p = PRESETS[i];
  if (!p) return;
  tween.fromP.copy(camera.position);
  tween.fromT.copy(controls.target);
  tween.toP.fromArray(p.pos);
  tween.toT.fromArray(p.tgt);
  tween.t = 0; tween.active = true;
}
function stepTween(dt) {
  tween.t += dt;
  const k = Math.min(1, tween.t / tween.dur);
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  camera.position.lerpVectors(tween.fromP, tween.toP, e);
  controls.target.lerpVectors(tween.fromT, tween.toT, e);
  if (k >= 1) tween.active = false;
}
/* =============================================================================
   11. UI WIRING
   ============================================================================= */
const $ = id => document.getElementById(id);
const el = {
  tod: $('todSlider'), todVal: $('todVal'), play: $('playBtn'),
  speed: $('speedSlider'), speedVal: $('speedVal'),
  petal: $('petalSlider'), petalVal: $('petalVal'),
  wind: $('windSlider'), windVal: $('windVal'),
  roVoxels: $('roVoxels'), roFps: $('roFps'), roTime: $('roTime'), roSeed: $('roSeed'),
  panel: $('panel'), collapse: $('collapseBtn'), help: $('helpBox'), helpBtn: $('helpBtn'),
  seed: $('seedBtn'), reset: $('resetView'), loading: $('loading')
};

function fmtTime(t) {
  const h = Math.floor(t) % 24, m = Math.floor((t % 1) * 60);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function syncUi() {
  el.tod.value = state.tod;
  el.todVal.textContent = fmtTime(state.tod);
  el.roTime.textContent = fmtTime(state.tod);
  el.speed.value = state.speed;
  el.speedVal.textContent = state.speed.toFixed(1) + 'x';
  el.petal.value = state.petalDensity;
  el.petalVal.textContent = String(state.petalDensity);
  el.wind.value = state.wind;
  el.windVal.textContent = state.wind.toFixed(2);
  el.play.textContent = state.playing ? '⏸ Pause' : '▶ Play';
  el.play.classList.toggle('active', !state.playing);
  document.querySelectorAll('.btn[data-t]').forEach(b => {
    b.classList.toggle('active', !!state[b.dataset.t]);
  });
  controls.autoRotate = state.autoRotate;
}

el.tod.addEventListener('input', () => { state.tod = parseFloat(el.tod.value); syncUi(); updateSky(state.tod); });
el.play.addEventListener('click', () => { state.playing = !state.playing; syncUi(); });
el.speed.addEventListener('input', () => { state.speed = parseFloat(el.speed.value); syncUi(); });
el.petal.addEventListener('input', () => { state.petalDensity = parseFloat(el.petal.value); syncUi(); });
el.wind.addEventListener('input', () => { state.wind = parseFloat(el.wind.value); syncUi(); });

document.querySelectorAll('.btn[data-t]').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.t;
    state[key] = !state[key];
    if (key === 'shadows') {
      renderer.shadowMap.enabled = state.shadows;
      scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
    }
    if (key === 'fireflies' && fireflies) fireflies.visible = state.fireflies;
    if (key === 'petalsOn' && petalMesh) petalMesh.visible = state.petalsOn;
    if (key === 'wireframe') applyWireframe();
    syncUi();
  });
});

function applyWireframe() {
  scene.traverse(o => {
    if (o.isMesh || o.isPoints) {
      const m = o.material;
      if (Array.isArray(m)) m.forEach(mm => { if (mm.wireframe !== undefined) mm.wireframe = state.wireframe; });
      else if (m && m.wireframe !== undefined) m.wireframe = state.wireframe;
    }
  });
}

document.querySelectorAll('.btn[data-cam]').forEach(btn => {
  btn.addEventListener('click', () => flyTo(parseInt(btn.dataset.cam, 10)));
});
el.reset.addEventListener('click', () => flyTo(0));
el.seed.addEventListener('click', () => buildGarden((Math.random() * 1e9) | 0));
el.helpBtn.addEventListener('click', e => { e.stopPropagation(); el.help.classList.toggle('open'); });
el.collapse.addEventListener('click', e => { e.stopPropagation(); el.panel.classList.toggle('collapsed'); });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); state.autoRotate = !state.autoRotate; syncUi(); }
  else if (k === 'n') {
    const isDay = state.tod > 5 && state.tod < 19;
    state.tod = isDay ? 21.5 : 10.5;
    state.playing = false; syncUi(); updateSky(state.tod);
  }
  else if (k >= '1' && k <= '5') flyTo(parseInt(k, 10) - 1);
  else if (k === 'r') buildGarden((Math.random() * 1e9) | 0);
  else if (k === 'h') el.help.classList.toggle('open');
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =============================================================================
   12. ANIMATION LOOP
   ============================================================================= */
const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);        // frame-rate independent
  state.time += dt;

  if (state.playing) {
    state.tod = (state.tod + dt * state.speed * 0.55) % 24;
    el.tod.value = state.tod;
  }
  const sky = updateSky(state.tod);
  el.todVal.textContent = fmtTime(state.tod);
  el.roTime.textContent = fmtTime(state.tod);

  updatePetals(dt);
  updateFireflies(state.time, sky.night);
  updateWater(state.time);
  updateKoi(state.time);
  if (tween.active) stepTween(dt);

  controls.update();
  renderer.render(scene, camera);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) {
    el.roFps.textContent = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }
}

/* =============================================================================
   13. BOOT
   ============================================================================= */
function boot() {
  syncUi();
  buildGarden(CFG.seed);
  flyTo(0);
  tween.active = false;
  camera.position.fromArray(PRESETS[0].pos);
  controls.target.fromArray(PRESETS[0].tgt);
  updateSky(state.tod);
  animate();
  requestAnimationFrame(() => {
    el.loading.classList.add('done');
    setTimeout(() => el.loading.remove(), 1000);
  });
}
boot();
</script>
</body>
